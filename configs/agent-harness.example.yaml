#     model:
#       base_url: http://127.0.0.1:8001/v1
#       model_id: your-local-model
#       timeout_s: 30
# Remote OpenAI-compatible service: use a key in an environment variable, never in YAML.
#     wrapper: trafficverse.agent_harness.models.api:ApiModel
