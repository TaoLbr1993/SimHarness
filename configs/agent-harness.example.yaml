# Paste the experiment ID shown on the desktop after starting an Agent-controlled run.
# When experiment_id is set, the agent connects to that experiment and does not create one.
api_url: http://127.0.0.1:8000
experiment_id: null
# These fields are only needed when experiment_id is null and the agent creates the run.
workspace_id: 00000000-0000-0000-0000-000000000000
scenario_id: 00000000-0000-0000-0000-000000000042
map_id: image2road
max_steps: 100
step_delay_s: 0.2
request_timeout_s: 30
observation_radius_m: 100  # XY radius in meters around each assigned vehicle
# Optional custom Skill directory, relative to this config file; default is bundled skills.
# skills_directory: agent-skills

# Empty means SUMO controls all vehicles. Uncomment one binding and set real vehicle IDs.
bindings: []
# Local OpenAI-compatible model service (replace model_id and URL):
# bindings:
#   - name: local_driver
#     wrapper: trafficverse.agent_harness.models.local:LocalModel
#     vehicle_ids: [car_001]
