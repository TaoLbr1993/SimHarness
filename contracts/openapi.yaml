info:
  title: SimHarness API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/experiments:
    post:
      operationId: create_experiment_api_v1_experiments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Experiment
  /api/v1/experiments/{experiment_id}:
    get:
      operationId: get_experiment_api_v1_experiments__experiment_id__get
      parameters:
      - in: path
        name: experiment_id
        required: true
        schema:
          format: uuid
          title: Experiment Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Experiment
  /api/v1/experiments/{experiment_id}/agent-session:
    get:
      operationId: view_api_v1_experiments__experiment_id__agent_session_get
      parameters:
      - in: path
        name: experiment_id
        required: true
        schema:
          format: uuid
          title: Experiment Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
