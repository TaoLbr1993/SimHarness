components:
  schemas:
    AgentApiCreateRequest:
      additionalProperties: false
      properties:
        api_base_url:
          format: uri
          minLength: 1
          title: Api Base Url
          type: string
        credential_env_var:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Z][A-Z0-9_]*$
          title: Credential Env Var
          type: string
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - api_base_url
      - model_id
      - credential_env_var
      title: AgentApiCreateRequest
      type: object
    AgentApiView:
      additionalProperties: false
      properties:
        agent_api_id:
          format: uuid
          title: Agent Api Id
          type: string
        api_base_url:
          format: uri
          minLength: 1
          title: Api Base Url
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_env_var:
          maxLength: 128
          minLength: 1
          title: Credential Env Var
          type: string
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - agent_api_id
      - workspace_id
      - name
      - api_base_url
      - model_id
      - credential_env_var
      - created_at
      - updated_at
      title: AgentApiView
      type: object
    AutomationDemand:
      additionalProperties: false
      description: Exact number of generated vehicles for one supported automation
        level.
      properties:
        level:
          enum:
          - L0
          - L1
          - L2
          - L3
          - L4
          - L5
          title: Level
          type: string
        vehicle_count:
          maximum: 100000.0
          minimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - level
      - vehicle_count
      title: AutomationDemand
      type: object
    AutomationLevel:
      enum:
      - HUMAN
      - ACC
      - L0
      - L1
      - L2
      - L3
      - L4
      - L5
      title: AutomationLevel
      type: string
    Body_import_map_api_v1_maps_import_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_import_map_api_v1_maps_import_post
      type: object
    CarlaFrame:
      additionalProperties: false
      properties:
        actor_count:
          minimum: 0.0
          title: Actor Count
          type: integer
        carla_frame:
          minimum: 0.0
          title: Carla Frame
          type: integer
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
      required:
      - simulation_time_ms
      - carla_frame
      - actor_count
      title: CarlaFrame
      type: object
    ComponentStatus:
      enum:
      - HEALTHY
      - DEGRADED
      - UNAVAILABLE
      - DISABLED
      title: ComponentStatus
      type: string
    DecisionInputPreview:
      properties:
        truncated:
          default: false
          title: Truncated
          type: boolean
        vehicles:
          default: []
          items:
            $ref: '#/components/schemas/VehicleInputPreview'
          title: Vehicles
          type: array
      title: DecisionInputPreview
      type: object
    DecisionPage:
      properties:
        items:
          default: []
          items:
            $ref: '#/components/schemas/DecisionSummary'
          title: Items
          type: array
        next_before_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Before Id
        session_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Session Id
        storage_warning:
          default: false
          title: Storage Warning
          type: boolean
        total:
          default: 0
          title: Total
          type: integer
      title: DecisionPage
      type: object
    DecisionRecord:
      properties:
        action_count:
          default: 0
          title: Action Count
          type: integer
        actions_text:
          default: '[]'
          title: Actions Text
          type: string
        elapsed_ms:
          default: 0
          title: Elapsed Ms
          type: integer
        fallback_count:
          default: 0
          title: Fallback Count
          type: integer
        group_name:
          title: Group Name
          type: string
        input_preview:
          anyOf:
          - $ref: '#/components/schemas/DecisionInputPreview'
          - type: 'null'
        input_text:
          default: ''
          title: Input Text
          type: string
        message:
          default: 正在推理
          title: Message
          type: string
        model_id:
          title: Model Id
          type: string
        outcome:
          default: pending
          enum:
          - pending
          - submitted
          - discarded
          - failed
          title: Outcome
          type: string
        output_text:
          default: ''
          title: Output Text
          type: string
        record_id:
          title: Record Id
          type: integer
        request_text:
          default: ''
          title: Request Text
          type: string
        sequence:
          title: Sequence
          type: integer
        simulation_time_ms:
          title: Simulation Time Ms
          type: integer
        started_at:
          format: date-time
          title: Started At
          type: string
        state:
          default: running
          enum:
          - running
          - completed
          - failed
          - skipped
          title: State
          type: string
        truncated:
          default: false
          title: Truncated
          type: boolean
        vehicle_count:
          default: 0
          title: Vehicle Count
          type: integer
      required:
      - record_id
      - sequence
      - simulation_time_ms
      - group_name
      - model_id
      - started_at
      title: DecisionRecord
      type: object
    DecisionSummary:
      properties:
        action_count:
          default: 0
          title: Action Count
          type: integer
        elapsed_ms:
          default: 0
          title: Elapsed Ms
          type: integer
        fallback_count:
          default: 0
          title: Fallback Count
          type: integer
        group_name:
          title: Group Name
          type: string
        message:
          default: 正在推理
          title: Message
          type: string
        model_id:
          title: Model Id
          type: string
        outcome:
          default: pending
          enum:
          - pending
          - submitted
          - discarded
          - failed
          title: Outcome
          type: string
        record_id:
          title: Record Id
          type: integer
        sequence:
          title: Sequence
          type: integer
        simulation_time_ms:
          title: Simulation Time Ms
          type: integer
        started_at:
          format: date-time
          title: Started At
          type: string
        state:
          default: running
          enum:
          - running
          - completed
          - failed
          - skipped
          title: State
          type: string
        truncated:
          default: false
          title: Truncated
          type: boolean
        vehicle_count:
          default: 0
          title: Vehicle Count
          type: integer
      required:
      - record_id
      - sequence
      - simulation_time_ms
      - group_name
      - model_id
      - started_at
      title: DecisionSummary
      type: object
    DomainEvent:
      additionalProperties: false
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
        event_type:
          minLength: 1
          title: Event Type
          type: string
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        payload:
          $ref: '#/components/schemas/JsonValue'
        severity:
          $ref: '#/components/schemas/EventSeverity'
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
      required:
      - event_id
      - experiment_id
      - event_type
      - severity
      - simulation_time_ms
      - payload
      title: DomainEvent
      type: object
    EventSeverity:
      enum:
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
      title: EventSeverity
      type: string
    ExperimentCreateRequest:
      additionalProperties: false
      properties:
        configuration_id:
          anyOf:
          - pattern: ^\d{4}(?:-\d{2}){5}$
            type: string
          - type: 'null'
          title: Configuration Id
        external_stepping:
          default: false
          title: External Stepping
          type: boolean
        map_id:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Map Id
        run_kind:
          $ref: '#/components/schemas/SimulationRunKind'
          default: simulation
        scenario_id:
          format: uuid
          title: Scenario Id
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - scenario_id
      title: ExperimentCreateRequest
      type: object
    ExperimentStatus:
      enum:
      - CREATED
      - PREPARING
      - READY
      - RUNNING
      - PAUSED
      - STOPPING
      - COMPLETED
      - FAILED
      title: ExperimentStatus
      type: string
    ExperimentView:
      additionalProperties: false
      properties:
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        external_stepping:
          default: false
          title: External Stepping
          type: boolean
        latest_sequence:
          default: 0
          minimum: 0.0
          title: Latest Sequence
          type: integer
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        speed_multiplier:
          exclusiveMinimum: 0.0
          title: Speed Multiplier
          type: number
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - experiment_id
      - workspace_id
      - status
      - simulation_time_ms
      - speed_multiplier
      title: ExperimentView
      type: object
    ExternalLocalStepRequest:
      additionalProperties: false
      description: Step once and return local observations for the selected vehicles.
      properties:
        actions:
          default: []
          items:
            $ref: '#/components/schemas/VehicleControlRequest'
          title: Actions
          type: array
        all_vehicles:
          default: false
          title: All Vehicles
          type: boolean
        automation_levels:
          default: []
          items:
            $ref: '#/components/schemas/AutomationLevel'
          title: Automation Levels
          type: array
        expected_sequence:
          minimum: 0.0
          title: Expected Sequence
          type: integer
        radius_m:
          exclusiveMinimum: 0.0
          title: Radius M
          type: number
        vehicle_ids:
          default: []
          items:
            type: string
          title: Vehicle Ids
          type: array
      required:
      - expected_sequence
      - radius_m
      title: ExternalLocalStepRequest
      type: object
    ExternalStepRequest:
      additionalProperties: false
      description: Actions for exactly one step based on a particular observation.
      properties:
        actions:
          default: []
          items:
            $ref: '#/components/schemas/VehicleControlRequest'
          title: Actions
          type: array
        expected_sequence:
          minimum: 0.0
          title: Expected Sequence
          type: integer
      required:
      - expected_sequence
      title: ExternalStepRequest
      type: object
    GeneratedAutomationShare:
      additionalProperties: false
      description: Actual departure allocation, rather than requested fractional percentages.
      properties:
        level:
          enum:
          - L0
          - L1
          - L2
          - L3
          - L4
          - L5
          title: Level
          type: string
        share_percent:
          maximum: 100.0
          minimum: 0.0
          title: Share Percent
          type: number
        vehicle_count:
          maximum: 20000.0
          minimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - level
      - vehicle_count
      - share_percent
      title: GeneratedAutomationShare
      type: object
    GeneratedScenarioSummary:
      additionalProperties: false
      description: Declared TrafficForge scene inputs; these fields contain no simulation
        observations.
      properties:
        automation_mix:
          items:
            $ref: '#/components/schemas/GeneratedAutomationShare'
          maxItems: 6
          title: Automation Mix
          type: array
        description:
          maxLength: 8000
          minLength: 1
          title: Description
          type: string
        desired_density_veh_per_km_lane:
          exclusiveMinimum: 0.0
          maximum: 120.0
          title: Desired Density Veh Per Km Lane
          type: number
        duration_s:
          maximum: 3600.0
          minimum: 60.0
          title: Duration S
          type: integer
        inflow_veh_per_hour_per_lane:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 10000.0
            type: number
          - type: 'null'
          title: Inflow Veh Per Hour Per Lane
        planned_vehicles:
          maximum: 20000.0
          minimum: 1.0
          title: Planned Vehicles
          type: integer
        seed:
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          type: integer
        simulation_mode:
          default: traffic
          enum:
          - traffic
          - autonomy
          title: Simulation Mode
          type: string
        task_id:
          pattern: ^\d{8}_\d{6}_[0-9a-f]{6}$
          title: Task Id
          type: string
        traffic_state:
          enum:
          - free_flow
          - moderate
          - congested
          title: Traffic State
          type: string
        unverified_requirements:
          items:
            maxLength: 8000
            minLength: 1
            type: string
          maxItems: 32
          title: Unverified Requirements
          type: array
        warmup_s:
          maximum: 3500.0
          minimum: 0.0
          title: Warmup S
          type: integer
      required:
      - task_id
      - description
      - traffic_state
      - desired_density_veh_per_km_lane
      - planned_vehicles
      - duration_s
      - warmup_s
      - seed
      title: GeneratedScenarioSummary
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        service:
          const: trafficverse-api
          default: trafficverse-api
          title: Service
          type: string
        status:
          const: ok
          default: ok
          title: Status
          type: string
      title: HealthResponse
      type: object
    JsonValue: {}
    LaneChangeDirection:
      enum:
      - NONE
      - LEFT
      - RIGHT
      title: LaneChangeDirection
      type: string
    LocalObservationFrame:
      additionalProperties: false
      properties:
        events:
          default: []
          items:
            $ref: '#/components/schemas/DomainEvent'
          title: Events
          type: array
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        observations:
          default: []
          items:
            $ref: '#/components/schemas/VehicleObservation'
          title: Observations
          type: array
        radius_m:
          exclusiveMinimum: 0.0
          title: Radius M
          type: number
        sequence:
          minimum: 0.0
          title: Sequence
          type: integer
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
      required:
      - experiment_id
      - simulation_time_ms
      - sequence
      - radius_m
      title: LocalObservationFrame
      type: object
    MapImportJob:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        errors:
          default: []
          items:
            type: string
          title: Errors
          type: array
        job_id:
          format: uuid
          title: Job Id
          type: string
        map_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Map Id
        status:
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          title: Status
          type: string
      required:
      - job_id
      - status
      title: MapImportJob
      type: object
    MapSummary:
      additionalProperties: false
      properties:
        carla_map:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Carla Map
        carla_version:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Carla Version
        display_name:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        files:
          default: []
          items:
            type: string
          title: Files
          type: array
        generated_scenario:
          anyOf:
          - $ref: '#/components/schemas/GeneratedScenarioSummary'
          - type: 'null'
        kind:
          default: core_run
          enum:
          - core_run
          - sumo
          title: Kind
          type: string
        manifest_available:
          default: true
          title: Manifest Available
          type: boolean
        map_id:
          minLength: 1
          title: Map Id
          type: string
        network_schema_version:
          minLength: 1
          title: Network Schema Version
          type: string
        sumo_begin_time_ms:
          default: 0
          minimum: 0.0
          title: Sumo Begin Time Ms
          type: integer
        sumo_config_file:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Sumo Config File
        sumo_end_time_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Sumo End Time Ms
        sumo_step_ms:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Sumo Step Ms
        validated:
          title: Validated
          type: boolean
        validation_errors:
          default: []
          items:
            type: string
          title: Validation Errors
          type: array
      required:
      - map_id
      - validated
      - network_schema_version
      title: MapSummary
      type: object
    MemoryConfig:
      additionalProperties: false
      description: Per-vehicle in-process memory configuration.
      properties:
        enabled:
          default: false
          title: Enabled
          type: boolean
        max_steps:
          default: 10
          maximum: 1000.0
          minimum: 1.0
          title: Max Steps
          type: integer
      title: MemoryConfig
      type: object
    MemoryInputPreview:
      properties:
        action_text:
          title: Action Text
          type: string
        next_speed_mps:
          anyOf:
          - type: number
          - type: 'null'
          title: Next Speed Mps
        sequence:
          title: Sequence
          type: integer
      required:
      - sequence
      - action_text
      title: MemoryInputPreview
      type: object
    MetricSample:
      additionalProperties: false
      properties:
        dimensions:
          additionalProperties:
            type: string
          title: Dimensions
          type: object
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        metric_name:
          minLength: 1
          title: Metric Name
          type: string
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        unit:
          minLength: 1
          title: Unit
          type: string
        value:
          title: Value
          type: number
      required:
      - experiment_id
      - metric_name
      - value
      - unit
      - simulation_time_ms
      title: MetricSample
      type: object
    ModelConfig:
      additionalProperties: false
      description: Connection settings; credentials are resolved from the named environment
        variable.
      properties:
        api_key_env:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Api Key Env
        base_url:
          minLength: 1
          title: Base Url
          type: string
        jev_acceleration_mps2:
          default: 1.0
          exclusiveMinimum: 0.0
          title: Jev Acceleration Mps2
          type: number
        model_id:
          minLength: 1
          title: Model Id
          type: string
        timeout_s:
          default: 30.0
          exclusiveMinimum: 0.0
          title: Timeout S
          type: number
      required:
      - base_url
      - model_id
      title: ModelConfig
      type: object
    NearbyInputPreview:
      properties:
        distance_m:
          title: Distance M
          type: number
        speed_mps:
          title: Speed Mps
          type: number
        vehicle_id:
          title: Vehicle Id
          type: string
      required:
      - vehicle_id
      - distance_m
      - speed_mps
      title: NearbyInputPreview
      type: object
    NearbyVehicle:
      additionalProperties: false
      properties:
        distance_m:
          minimum: 0.0
          title: Distance M
          type: number
        vehicle:
          $ref: '#/components/schemas/VehicleState'
      required:
      - vehicle
      - distance_m
      title: NearbyVehicle
      type: object
    ReadinessComponent:
      additionalProperties: false
      properties:
        component:
          minLength: 1
          title: Component
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        required:
          title: Required
          type: boolean
        status:
          $ref: '#/components/schemas/ComponentStatus'
      required:
      - component
      - status
      - required
      title: ReadinessComponent
      type: object
    ReadinessResponse:
      additionalProperties: false
      properties:
        components:
          items:
            $ref: '#/components/schemas/ReadinessComponent'
          title: Components
          type: array
        ready:
          title: Ready
          type: boolean
      required:
      - ready
      - components
      title: ReadinessResponse
      type: object
    SessionBinding:
      additionalProperties: false
      properties:
        all_vehicles:
          default: false
          title: All Vehicles
          type: boolean
        kind:
          default: api
          enum:
          - api
          - local
          - jev
          title: Kind
          type: string
        memory:
          $ref: '#/components/schemas/MemoryConfig'
        model:
          $ref: '#/components/schemas/ModelConfig'
        name:
          maxLength: 80
          minLength: 1
          title: Name
          type: string
        skills:
          default: []
          items:
            enum:
            - human_cautious
            - human_normal
            - human_reckless
            type: string
          title: Skills
          type: array
        vehicle_ids:
          default: []
          items:
            type: string
          maxItems: 10000
          title: Vehicle Ids
          type: array
      required:
      - name
      - model
      title: SessionBinding
      type: object
    SessionCheck:
      properties:
        issues:
          default: []
          items:
            type: string
          title: Issues
          type: array
        ready:
          title: Ready
          type: boolean
        warnings:
          default: []
          items:
            type: string
          title: Warnings
          type: array
      required:
      - ready
      title: SessionCheck
      type: object
    SessionConfig:
      additionalProperties: false
      properties:
        bindings:
          items:
            $ref: '#/components/schemas/SessionBinding'
          maxItems: 16
          minItems: 1
          title: Bindings
          type: array
        max_steps:
          default: 100
          maximum: 1000000.0
          minimum: 1.0
          title: Max Steps
          type: integer
        observation_radius_m:
          default: 100
          exclusiveMinimum: 0.0
          title: Observation Radius M
          type: number
        step_delay_s:
          default: 0
          maximum: 60.0
          minimum: 0.0
          title: Step Delay S
          type: number
      required:
      - bindings
      title: SessionConfig
      type: object
    SessionView:
      properties:
        config:
          anyOf:
          - $ref: '#/components/schemas/SessionConfig'
          - type: 'null'
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        experiment_status:
          title: Experiment Status
          type: string
        external_stepping:
          title: External Stepping
          type: boolean
        message:
          default: 尚未接入
          title: Message
          type: string
        sequence:
          default: 0
          title: Sequence
          type: integer
        session_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
